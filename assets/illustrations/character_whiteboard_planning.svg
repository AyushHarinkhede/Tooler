<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <style>
      .char-line { stroke: #1E2235; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .char-thin { stroke: #1E2235; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .char-dark { fill: #1E2235; stroke: #1E2235; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
      .char-skin { fill: #FEE8DE; stroke: #1E2235; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
      .char-pants { fill: var(--char-accent, #9468E8); stroke: #1E2235; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
      .char-pants-back { fill: #7E4EE0; stroke: #1E2235; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
      .char-white { fill: #FFFFFF; stroke: #1E2235; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
      .char-accent-light { fill: #EDE9FE; stroke: #1E2235; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      .char-sticky { fill: #DDD6FE; stroke: #1E2235; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      .char-prop-bg { fill: #F8F7FC; stroke: #1E2235; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- Ambient Floating Accents -->
  <circle cx="350" cy="55" r="3.0" fill="#C8B6FA" />
  <circle cx="365" cy="85" r="2.0" fill="#1E2235" />
  <circle cx="45" cy="120" r="3.5" fill="#9468E8" />
  <polygon points="370,140 376,143 370,146" fill="#C8B6FA" />

  <!-- Floor Baseline -->
  <line x1="20" y1="340" x2="380" y2="340" class="char-line" />

  <!-- Whiteboard on Wall -->
  <!-- Outer Frame -->
  <rect x="50" y="45" width="220" height="150" rx="4" class="char-prop-bg" />
  <!-- Pen Tray Bar at Bottom -->
  <rect x="44" y="195" width="232" height="6" rx="2" class="char-prop-bg" />

  <!-- Sticky Notes Flowchart on Whiteboard -->
  <!-- Top Left Note -->
  <rect x="70" y="65" width="30" height="25" rx="2" class="char-sticky" />
  <line x1="74" y1="72" x2="94" y2="72" class="char-thin" />
  <line x1="74" y1="78" x2="90" y2="78" class="char-thin" />
  <!-- Top Right Note -->
  <rect x="180" y="70" width="32" height="20" rx="2" class="char-sticky" />
  <line x1="184" y1="76" x2="206" y2="76" class="char-thin" />
  <line x1="184" y1="82" x2="200" y2="82" class="char-thin" />
  <!-- Center Main Note (Being Pointed At) -->
  <rect x="125" y="90" width="34" height="30" rx="2" class="char-sticky" />
  <line x1="130" y1="98" x2="152" y2="98" class="char-thin" />
  <line x1="130" y1="104" x2="150" y2="104" class="char-thin" />
  <line x1="130" y1="110" x2="144" y2="110" class="char-thin" />
  <!-- Bottom Left Note -->
  <rect x="80" y="125" width="28" height="26" rx="2" class="char-sticky" />
  <line x1="84" y1="133" x2="102" y2="133" class="char-thin" />
  <line x1="84" y1="139" x2="98" y2="139" class="char-thin" />
  <!-- Bottom Right Note -->
  <rect x="175" y="135" width="26" height="20" rx="2" class="char-sticky" />
  <line x1="179" y1="141" x2="196" y2="141" class="char-thin" />

  <!-- Flowchart Connectors / Arrows -->
  <path class="char-thin" d="M 100 80 Q 112 85 125 96" />
  <path class="char-thin" d="M 160 100 Q 170 85 180 82" />
  <path class="char-thin" d="M 142 120 L 142 135 L 110 138" />
  <path class="char-thin" d="M 160 115 Q 168 125 175 138" />
  <!-- Tiny Arrowheads -->
  <polyline points="121,93 125,96 120,99" class="char-thin" />
  <polyline points="176,80 180,82 178,86" class="char-thin" />

  <!-- Base Foliage Behind Character's Feet -->
  <path class="char-accent-light" d="M 230 340 C 235 305, 260 285, 275 300 C 285 310, 280 340, 280 340 Z" />
  <path class="char-accent-light" d="M 330 340 C 335 300, 360 280, 375 295 C 385 310, 370 340, 370 340 Z" />
  <!-- Stem leaves -->
  <path class="char-line" d="M 290 340 Q 295 310 290 285" />
  <path class="char-accent-light" d="M 290 285 C 298 280, 305 288, 298 295 C 292 292, 290 288, 290 285 Z" />
  <path class="char-accent-light" d="M 292 300 C 302 298, 306 308, 298 312 C 294 308, 292 302, 292 300 Z" />
  <path class="char-accent-light" d="M 288 308 C 280 306, 276 316, 284 320 C 288 316, 288 310, 288 308 Z" />

  <!-- Standing Character -->
  <!-- Left Leg (Far) -->
  <path class="char-pants-back" d="M 288 200 L 298 200 C 302 235, 305 285, 306 315 L 290 315 C 288 285, 286 235, 288 200 Z" />
  <!-- Right Leg (Near) -->
  <path class="char-pants" d="M 302 200 L 332 200 C 330 235, 328 285, 326 315 L 306 315 C 308 285, 310 235, 302 200 Z" />
  <path class="char-thin" d="M 308 245 Q 312 250 316 248" />

  <!-- White Sneakers -->
  <!-- Left Sneaker -->
  <path class="char-white" d="M 290 315 L 304 315 C 310 315, 314 322, 320 335 C 322 338, 320 340, 314 340 L 285 340 C 280 340, 282 335, 284 326 Z" />
  <line x1="285" y1="337" x2="318" y2="337" class="char-line" />
  <!-- Right Sneaker -->
  <path class="char-white" d="M 306 315 L 324 315 C 330 315, 336 322, 344 335 C 346 338, 344 340, 338 340 L 302 340 C 298 340, 299 335, 301 326 Z" />
  <line x1="302" y1="337" x2="342" y2="337" class="char-line" />

  <!-- Torso & Black Sweater -->
  <path class="char-dark" d="M 284 135 C 275 145, 272 175, 278 202 L 334 202 C 338 175, 335 145, 326 135 Z" />
  <!-- White Collar -->
  <path class="char-white" d="M 302 128 L 308 136 L 314 128 Z" />

  <!-- Head & Face Profile / 3-Quarter -->
  <!-- Neck -->
  <path class="char-skin" d="M 302 126 L 314 126 L 314 115 L 302 115 Z" />
  <!-- Head & Jaw -->
  <path class="char-skin" d="M 298 116 C 298 116, 294 100, 302 88 C 310 76, 326 76, 334 88 C 338 94, 338 104, 336 108 L 332 110 C 332 116, 325 122, 316 122 C 306 122, 300 120, 298 116 Z" />
  <!-- Ear -->
  <ellipse cx="304" cy="104" rx="4" ry="5.5" class="char-skin" />
  <path class="char-thin" d="M 304 102 Q 306 104 304 106" />
  <!-- Eye -->
  <circle cx="324" cy="99" r="1.5" fill="#1E2235" />
  <path class="char-thin" d="M 322 95 Q 325 94 328 96" />
  <!-- Nose Tip -->
  <path class="char-thin" d="M 329 101 L 334 103 L 329 106" />
  <!-- Smile -->
  <path class="char-thin" d="M 324 111 Q 328 112 331 109" />
  <!-- Dark Hair -->
  <path class="char-dark" d="M 298 102 C 294 92, 298 78, 308 72 C 318 64, 336 66, 342 78 C 346 86, 344 96, 336 96 C 330 96, 328 90, 320 88 C 312 86, 306 90, 302 98 Z" />

  <!-- Arms -->
  <!-- Left Arm (Front, pointing up at sticky note with marker) -->
  <path class="char-dark" d="M 294 138 C 282 142, 265 146, 252 142 L 210 134 C 204 132, 202 126, 206 122 L 216 116 C 224 112, 238 118, 250 124 L 286 130 Z" />
  <!-- Hand & Marker -->
  <path class="char-skin" d="M 206 122 C 202 120, 198 122, 196 118 C 195 116, 198 114, 202 114 L 208 116 Z" />
  <rect x="188" y="112" width="14" height="4" rx="1" transform="rotate(-15, 188, 112)" class="char-dark" />
  <!-- Right Arm (Back, resting casually down) -->
  <path class="char-dark" d="M 324 138 C 332 146, 336 160, 334 176 L 330 186 C 328 190, 322 192, 318 188 L 320 180 C 322 170, 320 156, 316 146 Z" />
  <path class="char-skin" d="M 318 188 C 316 192, 314 196, 310 196 C 308 194, 310 188, 314 186 Z" />
</svg>
