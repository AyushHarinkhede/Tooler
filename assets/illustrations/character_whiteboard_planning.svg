<svg viewBox="0 0 400 320" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <defs><style>
    .outline { stroke: #181829; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; fill: none; }
