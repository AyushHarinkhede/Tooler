<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <style>
      .char-line { stroke: #1E2235; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .char-thin { stroke: #1E2235; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .char-dark { fill: #1E2235; stroke: #1E2235; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
      .char-skin { fill: #FEE8DE; stroke: #1E2235; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
      .char-pants { fill: var(--char-accent, #9468E8); stroke: #1E2235; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
      .char-pants-back { fill: #7E4EE0; stroke: #1E2235; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
      .char-white { fill: #FFFFFF; stroke: #1E2235; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
      .char-accent-light { fill: #EDE9FE; stroke: #1E2235; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      .char-prop-bg { fill: #F8F7FC; stroke: #1E2235; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- Ambient Floating Accents -->
  <circle cx="350" cy="55" r="3.0" fill="#C8B6FA" />
  <circle cx="45" cy="115" r="3.5" fill="#9468E8" />
  <polygon points="360,180 366,183 360,186" fill="#C8B6FA" />

  <!-- Floor Baseline -->
  <line x1="20" y1="340" x2="380" y2="340" class="char-line" />

  <!-- Wide Project Roadmap / Gantt Schedule Board on Wall -->
  <rect x="45" y="55" width="280" height="150" rx="4" class="char-prop-bg" />
  <rect x="40" y="205" width="290" height="6" rx="2" class="char-prop-bg" />

  <!-- Grid Rows & Columns -->
  <line x1="45" y1="80" x2="325" y2="80" class="char-thin" />
  <line x1="45" y1="105" x2="325" y2="105" class="char-thin" />
  <line x1="45" y1="130" x2="325" y2="130" class="char-thin" />
  <line x1="45" y1="155" x2="325" y2="155" class="char-thin" />
  <line x1="45" y1="180" x2="325" y2="180" class="char-thin" />
  <!-- Vertical Week Columns -->
  <line x1="105" y1="55" x2="105" y2="205" class="char-thin" />
  <line x1="150" y1="55" x2="150" y2="205" class="char-thin" />
  <line x1="195" y1="55" x2="195" y2="205" class="char-thin" />
  <line x1="240" y1="55" x2="240" y2="205" class="char-thin" />
  <line x1="285" y1="55" x2="285" y2="205" class="char-thin" />

  <!-- Gantt Schedule Bars & Milestones -->
  <rect x="115" y="85" width="55" height="14" rx="3" class="char-accent-light" />
  <rect x="160" y="110" width="75" height="14" rx="3" class="char-pants" />
  <rect x="225" y="135" width="60" height="14" rx="3" class="char-accent-light" />
  <rect x="195" y="160" width="80" height="14" rx="3" class="char-prop-bg" />
  <!-- Flow arrows between bars -->
  <path class="char-thin" d="M 170 99 L 170 110" />
  <path class="char-thin" d="M 235 124 L 235 135" />

  <!-- Base Foliage Behind Feet -->
  <path class="char-accent-light" d="M 45 340 C 40 305, 65 285, 80 300 C 90 310, 85 340, 85 340 Z" />
  <path class="char-accent-light" d="M 285 340 C 290 300, 315 280, 330 295 C 340 310, 330 340, 330 340 Z" />
  <path class="char-line" d="M 60 340 Q 65 310 60 285" />
  <path class="char-line" d="M 305 340 Q 310 310 305 285" />

  <!-- Standing Character Presenting Roadmap -->
  <!-- Left Leg (Far) -->
  <path class="char-pants-back" d="M 288 200 L 298 200 C 302 235, 305 285, 306 315 L 290 315 C 288 285, 286 235, 288 200 Z" />
  <!-- Right Leg (Near) -->
  <path class="char-pants" d="M 302 200 L 332 200 C 330 235, 328 285, 326 315 L 306 315 C 308 285, 310 235, 302 200 Z" />
  <path class="char-thin" d="M 308 245 Q 312 250 316 248" />

  <!-- White Sneakers -->
  <path class="char-white" d="M 290 315 L 304 315 C 310 315, 314 322, 320 335 C 322 338, 320 340, 314 340 L 285 340 C 280 340, 282 335, 284 326 Z" />
  <line x1="285" y1="337" x2="318" y2="337" class="char-line" />
  <path class="char-white" d="M 306 315 L 324 315 C 330 315, 336 322, 344 335 C 346 338, 344 340, 338 340 L 302 340 C 298 340, 299 335, 301 326 Z" />
  <line x1="302" y1="337" x2="342" y2="337" class="char-line" />

  <!-- Torso & Black Sweater -->
  <path class="char-dark" d="M 284 135 C 275 145, 272 175, 278 202 L 334 202 C 338 175, 335 145, 326 135 Z" />
  <path class="char-white" d="M 302 128 L 308 136 L 314 128 Z" />

  <!-- Head & Face Profile -->
  <path class="char-skin" d="M 302 126 L 314 126 L 314 115 L 302 115 Z" />
  <path class="char-skin" d="M 298 116 C 298 116, 294 100, 302 88 C 310 76, 326 76, 334 88 C 338 94, 338 104, 336 108 L 332 110 C 332 116, 325 122, 316 122 C 306 122, 300 120, 298 116 Z" />
  <ellipse cx="304" cy="104" rx="4" ry="5.5" class="char-skin" />
  <circle cx="324" cy="99" r="1.5" fill="#1E2235" />
  <path class="char-thin" d="M 322 95 Q 325 94 328 96" />
  <path class="char-thin" d="M 329 101 L 334 103 L 329 106" />
  <path class="char-thin" d="M 324 111 Q 328 112 331 109" />
  <path class="char-dark" d="M 298 102 C 294 92, 298 78, 308 72 C 318 64, 336 66, 342 78 C 346 86, 344 96, 336 96 C 330 96, 328 90, 320 88 C 312 86, 306 90, 302 98 Z" />

  <!-- Arms -->
  <!-- Left Hand: Holding Executive Clipboard -->
  <path class="char-dark" d="M 328 140 C 336 150, 340 168, 338 185 L 322 196 C 318 198, 312 195, 314 190 L 324 180 C 326 170, 324 156, 320 146 Z" />
  <path class="char-skin" d="M 314 190 C 310 192, 305 192, 302 188 C 304 186, 310 186, 314 188 Z" />
  <!-- Clipboard with Sheet -->
  <rect x="290" y="172" width="24" height="34" rx="2" transform="rotate(-10, 290, 172)" class="char-prop-bg" />
  <rect x="296" y="170" width="12" height="4" rx="1" transform="rotate(-10, 290, 170)" class="char-dark" />
  <line x1="295" y1="180" x2="308" y2="178" class="char-thin" />
  <line x1="294" y1="186" x2="307" y2="184" class="char-thin" />

  <!-- Right Arm: Pointing with Marker at Gantt Chart Bar -->
  <path class="char-dark" d="M 294 138 C 282 142, 260 142, 245 138 L 225 125 C 220 122, 220 116, 225 114 L 235 110 C 242 108, 255 115, 268 122 L 286 130 Z" />
  <path class="char-skin" d="M 225 114 C 220 114, 215 115, 212 112 C 213 110, 216 109, 222 110 L 227 112 Z" />
  <rect x="204" y="108" width="14" height="4" rx="1" transform="rotate(-15, 204, 108)" class="char-dark" />
</svg>
