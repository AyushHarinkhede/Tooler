    .accent-light { fill: #EDE9FE; stroke: #181829; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
    .accent-mid { fill: #C4B5FD; }
    .shoe-white { fill: #FFFFFF; stroke: #181829; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
    .foliage-light { fill: #DDD6FE; stroke: #181829; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .foliage-mid { fill: #C4B5FD; stroke: #181829; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .foliage-dark { fill: #9468E8; stroke: #181829; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
</style></defs>
