<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <style>
      .char-line { stroke: #1E2235; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .char-thin { stroke: #1E2235; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .char-dark { fill: #1E2235; stroke: #1E2235; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
      .char-skin { fill: #FEE8DE; stroke: #1E2235; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
      .char-pants { fill: var(--char-accent, #9468E8); stroke: #1E2235; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
      .char-pants-back { fill: #7E4EE0; stroke: #1E2235; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
      .char-white { fill: #FFFFFF; stroke: #1E2235; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
      .char-accent-light { fill: #EDE9FE; stroke: #1E2235; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      .char-prop-bg { fill: #F8F7FC; stroke: #1E2235; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- Ambient Floating Accents -->
  <circle cx="350" cy="55" r="3.0" fill="#C8B6FA" />
  <circle cx="45" cy="115" r="3.5" fill="#9468E8" />
  <circle cx="360" cy="180" r="2.0" fill="#1E2235" />
  <polygon points="360,240 366,243 360,246" fill="#C8B6FA" />

  <!-- Floor Baseline -->
  <line x1="20" y1="340" x2="380" y2="340" class="char-line" />

  <!-- Plant at Bottom Left in Pot -->
  <polygon points="30,340 45,340 42,320 33,320" class="char-prop-bg" />
  <path class="char-accent-light" d="M 37 320 C 25 300, 25 280, 38 270 C 48 280, 45 305, 37 320 Z" />
  <path class="char-line" d="M 37 320 Q 34 290 38 272" />

  <!-- Floating Documents in Air -->
  <rect x="85" y="65" width="28" height="38" rx="2" class="char-prop-bg" />
  <line x1="91" y1="74" x2="105" y2="74" class="char-thin" />
  <line x1="91" y1="80" x2="107" y2="80" class="char-thin" />
  <line x1="91" y1="86" x2="101" y2="86" class="char-thin" />
  <rect x="105" y="55" width="28" height="38" rx="2" class="char-prop-bg" />
  <line x1="111" y1="64" x2="125" y2="64" class="char-thin" />
  <line x1="111" y1="70" x2="127" y2="70" class="char-thin" />
  <line x1="111" y1="76" x2="121" y2="76" class="char-thin" />
  <circle cx="120" cy="85" r="3" fill="#C8B6FA" />

  <!-- Dual Monitor Workstation Desk -->
  <!-- Desk Top -->
  <rect x="40" y="220" width="280" height="12" rx="3" class="char-prop-bg" />
  <!-- Pedestal Drawer Unit on Left -->
  <rect x="45" y="232" width="55" height="108" rx="2" class="char-accent-light" />
  <line x1="45" y1="268" x2="100" y2="268" class="char-line" />
  <line x1="45" y1="304" x2="100" y2="304" class="char-line" />
  <rect x="68" y="248" width="10" height="4" rx="1" fill="#1E2235" />
  <rect x="68" y="284" width="10" height="4" rx="1" fill="#1E2235" />
  <rect x="68" y="320" width="10" height="4" rx="1" fill="#1E2235" />
  <!-- Right Desk Leg -->
  <rect x="295" y="232" width="10" height="108" rx="2" class="char-prop-bg" />

  <!-- Dual Monitors -->
  <!-- Left Monitor -->
  <rect x="52" y="145" width="75" height="52" rx="3" class="char-prop-bg" />
  <rect x="56" y="149" width="67" height="44" rx="2" class="char-dark" />
  <!-- Monitor Stand -->
  <rect x="85" y="197" width="8" height="23" rx="1" class="char-prop-bg" />
  <ellipse cx="89" cy="220" rx="14" ry="3" class="char-prop-bg" />

  <!-- Right Monitor -->
  <rect x="135" y="145" width="75" height="52" rx="3" class="char-prop-bg" />
  <rect x="139" y="149" width="67" height="44" rx="2" class="char-dark" />
  <!-- Monitor Stand -->
  <rect x="168" y="197" width="8" height="23" rx="1" class="char-prop-bg" />
  <ellipse cx="172" cy="220" rx="14" ry="3" class="char-prop-bg" />

  <!-- Office Chair Behind Character -->
  <rect x="275" y="190" width="12" height="60" rx="6" class="char-accent-light" />
  <line x1="281" y1="250" x2="281" y2="275" class="char-line" />
  <rect x="235" y="265" width="60" height="12" rx="5" class="char-prop-bg" />
  <line x1="265" y1="277" x2="265" y2="320" class="char-line" />
  <path class="char-line" d="M 235 334 L 265 320 L 295 334" />
  <circle cx="233" cy="336" r="4" fill="#1E2235" />
  <circle cx="265" cy="336" r="4" fill="#1E2235" />
  <circle cx="297" cy="336" r="4" fill="#1E2235" />

  <!-- Seated Developer Character -->
  <!-- Left Leg (Far) -->
  <path class="char-pants-back" d="M 250 255 L 210 255 C 198 255, 194 262, 196 274 L 204 316 C 205 325, 200 328, 190 328 L 175 328 C 168 328, 166 322, 167 315 L 172 270 C 174 256, 184 246, 200 246 L 240 246 Z" />
  <!-- Right Leg (Near) -->
  <path class="char-pants" d="M 265 255 L 225 255 C 215 255, 210 262, 212 274 L 220 316 C 221 325, 216 328, 206 328 L 190 328 C 182 328, 180 322, 182 315 L 188 270 C 190 256, 202 246, 218 246 L 255 246 Z" />
  <path class="char-thin" d="M 215 264 Q 218 272 215 280" />

  <!-- White Sneakers -->
  <path class="char-white" d="M 190 328 L 174 328 C 166 328, 158 332, 142 340 L 195 340 C 196 338, 194 335, 192 332 Z" />
  <line x1="145" y1="337" x2="195" y2="337" class="char-line" />
  <path class="char-white" d="M 206 328 L 190 328 C 182 328, 174 332, 158 340 L 212 340 C 214 338, 212 335, 208 332 Z" />
  <line x1="160" y1="337" x2="212" y2="337" class="char-line" />

  <!-- Torso & Black Sweater -->
  <path class="char-dark" d="M 270 238 C 275 210, 268 180, 248 165 C 234 155, 218 156, 210 168 C 204 175, 202 205, 206 240 Z" />
  <path class="char-white" d="M 224 162 L 216 170 L 210 162 Z" />

  <!-- Head & Face Profile -->
  <path class="char-skin" d="M 224 160 L 212 160 L 212 146 L 224 146 Z" />
  <path class="char-skin" d="M 228 146 C 228 146, 232 130, 224 116 C 214 104, 198 104, 188 116 C 184 122, 184 132, 186 136 L 190 138 C 190 144, 198 150, 208 150 C 218 150, 224 148, 228 146 Z" />
  <ellipse cx="222" cy="132" rx="4" ry="5.5" class="char-skin" />
  <path class="char-thin" d="M 222 130 Q 220 132 222 134" />
  <circle cx="202" cy="126" r="1.5" fill="#1E2235" />
  <path class="char-thin" d="M 204 122 Q 200 121 197 123" />
  <path class="char-thin" d="M 197 127 L 192 129 L 197 132" />
  <path class="char-thin" d="M 200 137 Q 196 138 193 135" />
  <path class="char-dark" d="M 228 130 C 232 120, 228 106, 218 98 C 206 90, 188 92, 182 104 C 178 112, 180 122, 188 122 C 194 122, 196 116, 204 114 C 212 112, 218 116, 222 124 Z" />

  <!-- Arms & Hands -->
  <!-- Left Hand: Resting on Desk / Typing -->
  <path class="char-dark" d="M 215 170 C 205 180, 185 195, 168 200 L 140 206 C 132 208, 130 214, 135 218 L 150 218 C 165 218, 185 208, 198 198 Z" />
  <path class="char-skin" d="M 135 218 C 130 218, 124 218, 120 220 C 122 222, 126 222, 135 222 Z" />
  <!-- Right Arm: Holding Open Document -->
  <path class="char-dark" d="M 235 170 C 228 180, 222 195, 218 205 L 210 216 C 206 220, 200 218, 198 212 L 202 202 C 208 190, 216 178, 228 170 Z" />
  <path class="char-skin" d="M 200 214 C 196 216, 192 216, 188 214 C 190 212, 194 210, 198 212 Z" />
  <!-- Printed Document in Hand -->
  <rect x="180" y="196" width="26" height="34" rx="2" transform="rotate(15, 180, 196)" class="char-prop-bg" />
  <line x1="184" y1="205" x2="198" y2="208" class="char-thin" />
  <line x1="185" y1="211" x2="199" y2="214" class="char-thin" />
  <line x1="187" y1="217" x2="197" y2="219" class="char-thin" />
</svg>
