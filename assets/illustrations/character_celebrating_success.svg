<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <style>
      .char-line { stroke: #1E2235; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .char-thin { stroke: #1E2235; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .char-dark { fill: #1E2235; stroke: #1E2235; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
      .char-skin { fill: #FEE8DE; stroke: #1E2235; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
      .char-pants { fill: var(--char-accent, #9468E8); stroke: #1E2235; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
      .char-pants-back { fill: #7E4EE0; stroke: #1E2235; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
      .char-white { fill: #FFFFFF; stroke: #1E2235; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
      .char-accent-light { fill: #EDE9FE; stroke: #1E2235; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      .char-prop-bg { fill: #F8F7FC; stroke: #1E2235; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
      .char-success { stroke: #10B981; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    </style>
  </defs>

  <!-- Ambient Floating Accents -->
  <circle cx="55" cy="70" r="3.0" fill="#C8B6FA" />
  <circle cx="360" cy="115" r="4.0" fill="#9468E8" />
  <circle cx="45" cy="165" r="2.0" fill="#1E2235" />
  <polygon points="360,65 365,68 360,71" fill="#C8B6FA" />

  <!-- 3x3 Dot Matrix -->
  <g fill="#C8B6FA">
    <circle cx="280" cy="85" r="1.8" /><circle cx="287" cy="85" r="1.8" /><circle cx="294" cy="85" r="1.8" />
    <circle cx="280" cy="92" r="1.8" /><circle cx="287" cy="92" r="1.8" /><circle cx="294" cy="92" r="1.8" />
    <circle cx="280" cy="99" r="1.8" /><circle cx="287" cy="99" r="1.8" /><circle cx="294" cy="99" r="1.8" />
  </g>

  <!-- Floor Baseline -->
  <line x1="20" y1="340" x2="380" y2="340" class="char-line" />

  <!-- Floating Checklist Card on Wall -->
  <rect x="230" y="85" width="42" height="52" rx="4" class="char-prop-bg" />
  <!-- Checkmark 1 -->
  <rect x="236" y="93" width="8" height="8" rx="1.5" class="char-prop-bg" />
  <polyline points="237,97 239,99 243,94" class="char-success" />
  <line x1="248" y1="97" x2="265" y2="97" class="char-thin" />
  <!-- Checkmark 2 -->
  <rect x="236" y="107" width="8" height="8" rx="1.5" class="char-prop-bg" />
  <polyline points="237,111 239,113 243,108" class="char-success" />
  <line x1="248" y1="111" x2="263" y2="111" class="char-thin" />
  <!-- Checkmark 3 -->
  <rect x="236" y="121" width="8" height="8" rx="1.5" class="char-prop-bg" />
  <polyline points="237,125 239,127 243,122" class="char-success" />
  <line x1="248" y1="125" x2="260" y2="125" class="char-thin" />

  <!-- Office Chair Behind Character -->
  <rect x="330" y="185" width="12" height="60" rx="6" class="char-accent-light" />
  <line x1="336" y1="245" x2="336" y2="270" class="char-line" />
  <rect x="290" y="260" width="60" height="12" rx="5" class="char-prop-bg" />
  <line x1="320" y1="272" x2="320" y2="315" class="char-line" />
  <path class="char-line" d="M 290 332 L 320 315 L 350 332" />
  <circle cx="288" cy="336" r="4" fill="#1E2235" />
  <circle cx="320" cy="336" r="4" fill="#1E2235" />
  <circle cx="352" cy="336" r="4" fill="#1E2235" />

  <!-- Seated Character Legs -->
  <!-- Left Leg (Far) -->
  <path class="char-pants-back" d="M 305 250 L 265 250 C 253 250, 249 257, 251 269 L 259 311 C 260 320, 255 323, 245 323 L 230 323 C 223 323, 221 317, 222 310 L 227 265 C 229 251, 239 241, 255 241 L 295 241 Z" />
  <!-- Right Leg (Near) -->
  <path class="char-pants" d="M 320 250 L 280 250 C 270 250, 265 257, 267 269 L 275 311 C 276 320, 271 323, 261 323 L 245 323 C 237 323, 235 317, 237 310 L 243 265 C 245 251, 257 241, 273 241 L 310 241 Z" />
  <path class="char-thin" d="M 270 259 Q 273 267 270 275" />

  <!-- White Sneakers -->
  <path class="char-white" d="M 245 323 L 229 323 C 221 323, 213 327, 197 335 L 250 335 C 251 333, 249 330, 247 327 Z" />
  <line x1="200" y1="337" x2="250" y2="337" class="char-line" />
  <path class="char-white" d="M 261 323 L 245 323 C 237 323, 229 327, 213 335 L 267 335 C 269 333, 267 330, 263 327 Z" />
  <line x1="215" y1="337" x2="267" y2="337" class="char-line" />

  <!-- Torso & Black Sweater -->
  <path class="char-dark" d="M 325 233 C 330 205, 323 175, 303 160 C 289 150, 273 151, 265 163 C 259 170, 257 200, 261 235 Z" />
  <path class="char-white" d="M 279 157 L 271 165 L 265 157 Z" />

  <!-- Head & Happy Face Profile -->
  <path class="char-skin" d="M 279 155 L 267 155 L 267 141 L 279 141 Z" />
  <path class="char-skin" d="M 283 141 C 283 141, 287 125, 279 111 C 269 99, 253 99, 243 111 C 239 117, 239 127, 241 131 L 245 133 C 245 139, 253 145, 263 145 C 273 145, 279 143, 283 141 Z" />
  <ellipse cx="277" cy="127" rx="4" ry="5.5" class="char-skin" />
  <path class="char-thin" d="M 277 125 Q 275 127 277 129" />
  <!-- Happy Closed Eye Arc `^` -->
  <path class="char-line" d="M 253 121 Q 257 117 261 121" />
  <path class="char-thin" d="M 254 115 Q 258 113 262 116" />
  <path class="char-thin" d="M 252 122 L 247 124 L 252 127" />
  <!-- Big Joyous Smile -->
  <path class="char-line" d="M 254 130 Q 259 135 264 129" />
  <!-- Hair -->
  <path class="char-dark" d="M 283 125 C 287 115, 283 101, 273 93 C 261 85, 243 87, 237 99 C 233 107, 235 117, 243 117 C 249 117, 251 111, 259 109 C 267 107, 273 111, 277 119 Z" />

  <!-- Arms -->
  <!-- Left Hand: Resting on Desk Near Laptop -->
  <path class="char-dark" d="M 270 165 C 260 175, 240 190, 223 195 L 195 201 C 187 203, 185 209, 190 213 L 205 213 C 220 213, 240 203, 253 193 Z" />
  <path class="char-skin" d="M 190 213 C 185 213, 179 213, 175 215 C 177 217, 181 217, 190 217 Z" />

  <!-- Right Arm: Raised High in Victory Fist Pump `✊` -->
  <path class="char-dark" d="M 290 165 C 298 155, 305 138, 303 125 L 301 95 C 300 88, 294 86, 290 92 L 282 105 C 276 118, 278 135, 280 148 Z" />
  <!-- Fist Pump `✊` -->
  <path class="char-skin" d="M 296 92 C 298 86, 302 82, 308 82 C 314 82, 316 88, 312 94 L 302 96 Z" />
  <!-- Thumb & Fingers Crease -->
  <path class="char-thin" d="M 302 87 Q 306 88 308 92" />

  <!-- Desk & Laptop -->
  <rect x="70" y="215" width="220" height="12" rx="3" class="char-prop-bg" />
  <rect x="85" y="227" width="10" height="113" rx="2" class="char-prop-bg" />
  <rect x="270" y="227" width="10" height="113" rx="2" class="char-prop-bg" />
  <!-- Laptop on Desk -->
  <polygon points="120,215 178,215 172,207 126,207" class="char-prop-bg" />
  <polygon points="172,207 196,157 156,157 132,207" class="char-prop-bg" />
  <polygon points="168,203 190,161 160,161 138,203" class="char-accent-light" />
  <rect x="144" y="210" width="14" height="4" rx="1" class="char-thin" />

  <!-- Plant at Bottom Left Behind Desk -->
  <path class="char-accent-light" d="M 35 340 C 30 300, 50 275, 65 285 C 75 295, 70 340, 70 340 Z" />
  <path class="char-line" d="M 50 340 Q 55 305 65 285" />
</svg>
