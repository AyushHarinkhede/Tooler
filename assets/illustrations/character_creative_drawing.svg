<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <style>
      .char-line { stroke: #1E2235; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .char-thin { stroke: #1E2235; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .char-dark { fill: #1E2235; stroke: #1E2235; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
      .char-skin { fill: #FEE8DE; stroke: #1E2235; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
      .char-pants { fill: var(--char-accent, #9468E8); stroke: #1E2235; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
      .char-pants-back { fill: #7E4EE0; stroke: #1E2235; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
      .char-white { fill: #FFFFFF; stroke: #1E2235; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
      .char-accent-light { fill: #EDE9FE; stroke: #1E2235; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      .char-prop-bg { fill: #F8F7FC; stroke: #1E2235; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- Ambient Floating Accents -->
  <circle cx="340" cy="55" r="3.0" fill="#1E2235" />
  <circle cx="240" cy="45" r="4.0" fill="#9468E8" />
  <polygon points="255,165 261,168 255,171" fill="#C8B6FA" />

  <!-- Floor Baseline -->
  <line x1="20" y1="340" x2="380" y2="340" class="char-line" />

  <!-- Floating UI Wireframe Mockup Artboard on Wall -->
  <rect x="235" y="75" width="46" height="60" rx="3" class="char-prop-bg" />
  <rect x="240" y="80" width="36" height="8" rx="1.5" class="char-accent-light" />
  <!-- Wireframe Box 1 with X -->
  <rect x="240" y="92" width="16" height="18" rx="1" class="char-prop-bg" />
  <line x1="240" y1="92" x2="256" y2="110" class="char-thin" />
  <line x1="256" y1="92" x2="240" y2="110" class="char-thin" />
  <!-- Wireframe Box 2 with X -->
  <rect x="260" y="92" width="16" height="18" rx="1" class="char-prop-bg" />
  <line x1="260" y1="92" x2="276" y2="110" class="char-thin" />
  <line x1="276" y1="92" x2="260" y2="110" class="char-thin" />
  <!-- Text lines below wireframes -->
  <line x1="240" y1="116" x2="276" y2="116" class="char-thin" />
  <line x1="240" y1="122" x2="268" y2="122" class="char-thin" />
  <line x1="240" y1="128" x2="272" y2="128" class="char-thin" />

  <!-- Small Wooden Stool with Steaming Coffee (Left of Chair) -->
  <ellipse cx="230" cy="225" rx="18" ry="4" class="char-prop-bg" />
  <line x1="216" y1="227" x2="210" y2="295" class="char-line" />
  <line x1="244" y1="227" x2="250" y2="295" class="char-line" />
  <line x1="212" y1="265" x2="248" y2="265" class="char-thin" />
  <!-- Coffee Mug & Steam -->
  <rect x="223" y="207" width="14" height="18" rx="2" class="char-accent-light" />
  <path class="char-line" d="M 237 212 C 243 212, 243 220, 237 220" />
  <path class="char-thin" d="M 227 202 Q 229 196 226 190 Q 229 184 227 178" />

  <!-- Plant Leaves at Bottom Left Behind Stool -->
  <path class="char-accent-light" d="M 195 340 C 190 295, 215 270, 235 285 C 250 300, 240 340, 240 340 Z" />
  <path class="char-line" d="M 210 340 Q 220 295 233 285" />

  <!-- Executive High-Back Chair Behind Character -->
  <rect x="330" y="165" width="55" height="105" rx="14" class="char-prop-bg" />
  <rect x="335" y="175" width="42" height="85" rx="8" class="char-accent-light" />
  <rect x="290" y="260" width="65" height="15" rx="6" class="char-prop-bg" />
  <line x1="320" y1="275" x2="320" y2="315" class="char-line" />
  <line x1="320" y1="285" x2="335" y2="285" class="char-line" />
  <circle cx="337" cy="285" r="3" fill="#1E2235" />
  <path class="char-line" d="M 290 332 L 320 315 L 350 332" />
  <circle cx="288" cy="336" r="4.5" fill="#1E2235" />
  <circle cx="320" cy="336" r="4.5" fill="#1E2235" />
  <circle cx="352" cy="336" r="4.5" fill="#1E2235" />

  <!-- Character Legs Crossed at Ankle -->
  <!-- Bottom Leg (Far) -->
  <path class="char-pants-back" d="M 305 250 L 255 250 C 245 250, 238 256, 234 268 L 210 315 C 205 324, 200 325, 192 322 L 180 318 C 175 316, 175 310, 180 304 L 208 260 C 216 248, 228 238, 244 238 L 290 238 Z" />
  <!-- Top Leg (Near, Crossed Over) -->
  <path class="char-pants" d="M 315 248 L 260 248 C 248 248, 236 240, 222 226 L 178 188 C 170 182, 164 186, 160 196 L 145 242 C 142 252, 134 256, 124 256 L 115 256 C 108 256, 106 250, 108 242 L 118 205 C 124 185, 140 174, 160 174 C 180 174, 205 190, 230 215 L 265 240 Z" />

  <!-- White Sneakers -->
  <path class="char-white" d="M 124 256 L 110 256 C 102 256, 95 264, 82 280 C 78 284, 80 286, 88 286 L 128 286 C 134 286, 132 278, 130 268 Z" />
  <line x1="84" y1="283" x2="128" y2="283" class="char-line" />
  <path class="char-white" d="M 192 322 L 178 322 C 170 322, 165 326, 153 336 C 150 338, 152 340, 158 340 L 194 340 C 200 340, 198 335, 196 328 Z" />
  <line x1="154" y1="337" x2="194" y2="337" class="char-line" />

  <!-- Torso & Black Sweater -->
  <path class="char-dark" d="M 325 230 C 330 200, 323 165, 303 150 C 289 140, 273 142, 265 154 C 259 162, 257 195, 261 232 Z" />
  <path class="char-white" d="M 279 148 L 271 156 L 265 148 Z" />

  <!-- Head & Face Profile (Looking at Tablet Screen) -->
  <path class="char-skin" d="M 279 145 L 267 145 L 267 128 L 279 130 Z" />
  <path class="char-skin" d="M 283 128 C 283 128, 287 110, 279 98 C 269 84, 251 84, 243 96 C 237 104, 239 114, 241 118 L 247 120 C 247 126, 255 132, 265 132 C 275 132, 281 130, 283 128 Z" />
  <ellipse cx="277" cy="114" rx="4" ry="5.5" class="char-skin" />
  <path class="char-thin" d="M 277 112 Q 275 114 277 116" />
  <circle cx="255" cy="110" r="1.5" fill="#1E2235" />
  <path class="char-thin" d="M 257 105 Q 253 104 250 106" />
  <path class="char-thin" d="M 250 110 L 245 112 L 250 115" />
  <path class="char-thin" d="M 252 121 Q 248 122 245 119" />
  <path class="char-dark" d="M 283 110 C 287 100, 283 86, 271 78 C 259 70, 241 72, 235 84 C 231 92, 233 102, 241 102 C 247 102, 249 96, 257 94 C 265 92, 273 96, 277 106 Z" />

  <!-- Arms Drawing with Stylus on Tablet -->
  <!-- Left Hand Holding Tablet -->
  <path class="char-dark" d="M 280 156 C 272 165, 258 178, 244 182 L 216 186 C 208 188, 204 184, 208 178 L 228 172 C 242 168, 254 158, 262 150 Z" />
  <path class="char-skin" d="M 216 184 C 211 184, 204 182, 200 186 C 198 188, 200 190, 206 190 L 218 190 Z" />
  <!-- Tablet Held in Hand -->
  <rect x="200" y="150" width="38" height="52" rx="4" transform="rotate(15, 200, 150)" class="char-prop-bg" />
  <rect x="204" y="154" width="30" height="44" rx="2" transform="rotate(15, 200, 150)" class="char-accent-light" />
  <!-- Right Arm with Stylus -->
  <path class="char-dark" d="M 305 155 C 298 165, 282 180, 272 188 L 252 196 C 246 198, 242 194, 244 188 L 256 180 C 268 172, 280 162, 290 150 Z" />
  <path class="char-skin" d="M 248 192 C 244 190, 238 188, 236 192 C 236 194, 240 196, 246 196 Z" />
  <!-- Stylus Pen Pointing at Tablet -->
  <line x1="250" y1="185" x2="238" y2="198" class="char-dark" />
</svg>
