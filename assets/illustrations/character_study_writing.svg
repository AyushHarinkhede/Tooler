  <polygon points="144,193 150,196 153,190 147,187" fill="#FFFFFF" stroke="#1E2235" stroke-width="1.8" />
  <ellipse cx="148" cy="195" rx="5" ry="4" fill="#FEE8DE" stroke="#1E2235" stroke-width="1.8" />

