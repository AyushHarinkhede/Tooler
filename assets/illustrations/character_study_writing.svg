  <line x1="165" y1="192" x2="165" y2="197" stroke="#1E2235" stroke-width="1.5" />

  <!-- Upright File Binders & Stacked Books on Left -->
  <!-- Binder 1 -->
  <rect x="75" y="152" width="12" height="44" rx="2" fill="#EDE9FE" stroke="#1E2235" stroke-width="1.8" />
  <circle cx="81" cy="164" r="2" fill="#9468E8" />
  <!-- Binder 2 -->
  <rect x="89" y="152" width="12" height="44" rx="2" fill="#C8B6FA" stroke="#1E2235" stroke-width="1.8" />
  <circle cx="95" cy="164" r="2" fill="#9468E8" />
  <!-- Stacked Books Beside Binders -->
  <rect x="106" y="180" width="30" height="8" rx="1.5" fill="#EDE9FE" stroke="#1E2235" stroke-width="1.5" />
  <rect x="108" y="188" width="30" height="8" rx="1.5" fill="#9468E8" stroke="#1E2235" stroke-width="1.5" />

  <!-- Angled Architect Desk Lamp on Right -->
  <line x1="300" y1="196" x2="295" y2="155" stroke="#1E2235" stroke-width="2.4" stroke-linecap="round" />
  <line x1="295" y1="155" x2="270" y2="140" stroke="#1E2235" stroke-width="2.4" stroke-linecap="round" />
  <circle cx="295" cy="155" r="3.5" fill="#1E2235" />
  <!-- Lamp Shade (Angled towards notebook) -->
  <polygon points="270,140 250,145 260,165" fill="#EDE9FE" stroke="#1E2235" stroke-width="2.0" stroke-linejoin="round" />
  <!-- Light Beam Dotted Lines -->
  <line x1="252" y1="155" x2="195" y2="192" stroke="#C8B6FA" stroke-width="1.5" stroke-dasharray="3,3" />
</svg>