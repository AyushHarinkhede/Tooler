  <rect x="55" y="196" width="280" height="12" rx="3" fill="#F4F1F8" stroke="#1E2235" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="68" y="208" width="10" height="132" rx="2" fill="#F4F1F8" stroke="#1E2235" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="310" y="208" width="10" height="132" rx="2" fill="#F4F1F8" stroke="#1E2235" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="78" y1="300" x2="310" y2="300" stroke="#1E2235" stroke-width="1.5" stroke-linecap="round" />

