  <path fill="none" stroke="#1E2235" stroke-width="1.5" stroke-linecap="round" d="M 160 108 Q 156 107, 153 109" />
  <circle cx="156" cy="113" r="1.5" fill="#1E2235" />
  <path fill="none" stroke="#1E2235" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" d="M 150 113 L 146 116 L 150 119" />
  <path fill="none" stroke="#1E2235" stroke-width="1.5" stroke-linecap="round" d="M 156 124 Q 160 126, 164 123" />

