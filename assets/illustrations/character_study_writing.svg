  <path fill="#9468E8" stroke="#1E2235" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M 195 235 L 165 235 L 160 285 L 155 320 L 175 320 L 180 285 L 205 245 Z" />
