<svg viewBox="0 0 400 320" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <defs><style>
    .outline { stroke: #181829; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .thin-line { stroke: #181829; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    .hair-dark { fill: #181829; stroke: #181829; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
    .sweater-dark { fill: #181829; stroke: #181829; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
    .skin-white { fill: #FFFFFF; stroke: #181829; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
    .pants-purple { fill: #9468E8; stroke: #181829; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
    .pants-purple-back { fill: #7C3AED; stroke: #181829; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
    .accent-light { fill: #EDE9FE; stroke: #181829; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
    .accent-mid { fill: #C4B5FD; }
    .shoe-white { fill: #FFFFFF; stroke: #181829; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
    .foliage-light { fill: #DDD6FE; stroke: #181829; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .foliage-mid { fill: #C4B5FD; stroke: #181829; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .foliage-dark { fill: #9468E8; stroke: #181829; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
</style></defs>
  <circle cx="55" cy="70" r="3" fill="#181829" />
  <circle cx="330" cy="65" r="4" fill="#9468E8" />
