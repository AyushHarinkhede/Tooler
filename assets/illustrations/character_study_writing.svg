  <rect x="180" y="255" width="65" height="13" rx="6.5" fill="#EDE9FE" stroke="#1E2235" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="210" y1="268" x2="210" y2="320" stroke="#1E2235" stroke-width="2.4" stroke-linecap="round" />
  <path fill="none" stroke="#1E2235" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M 185 334 L 210 320 L 235 334" />
