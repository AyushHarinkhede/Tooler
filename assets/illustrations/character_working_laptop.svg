<svg viewBox="0 0 500 550" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <!-- Definition / Styles -->
  <style>
    .outline { stroke: #23233A; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .thin-line { stroke: #23233A; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .fill-dark { fill: #23233A; }
    .fill-purple { fill: #9468E8; }
    .fill-purple-light { fill: #ECE5FC; }
    .fill-purple-mid { fill: #C9B4F8; }
    .fill-white { fill: #FFFFFF; }
    .fill-none { fill: none; }
  </style>

  <!-- Ambient background elements -->
  <circle cx="95" cy="115" r="5" fill="#9468E8" />
  <circle cx="215" cy="70" r="3" fill="#C9B4F8" />
  <circle cx="430" cy="120" r="2.5" fill="#23233A" />
  <circle cx="225" cy="95" r="2" fill="#23233A" />
  
  <!-- Mini 3x3 dot grid in background -->
  <g fill="#C9B4F8" transform="translate(390, 240)">
    <circle cx="0" cy="0" r="2" />
    <circle cx="8" cy="0" r="2" />
    <circle cx="16" cy="0" r="2" />
    <circle cx="0" cy="8" r="2" />
    <circle cx="8" cy="8" r="2" />
    <circle cx="16" cy="8" r="2" />
    <circle cx="0" cy="16" r="2" />
    <circle cx="8" cy="16" r="2" />
    <circle cx="16" cy="16" r="2" />
  </g>

  <!-- Floating accent cross -->
  <path d="M 90 270 L 98 270 M 94 266 L 94 274" class="thin-line" stroke="#9468E8" />
  <path d="M 440 290 L 448 290 M 444 286 L 444 294" class="thin-line" stroke="#9468E8" />

  <!-- Floor baseline -->
  <line x1="40" y1="460" x2="460" y2="460" class="outline" />

  <!-- CHAIR BACKGROUND (Stool back / structure) -->
  <g id="chair-back">
    <path d="M 125 210 C 125 185 145 175 165 175 C 185 175 195 185 195 210 Z" class="outline fill-purple-light" />
    <!-- Seat cushion -->
    <rect x="120" y="210" width="75" height="15" rx="7" class="outline fill-purple-light" />
    <!-- Stem & base -->
    <path d="M 157 225 L 157 390" class="outline" />
    <!-- Wheels base -->
    <path d="M 130 400 L 157 390 L 185 400" class="outline fill-none" />
    <circle cx="128" cy="403" r="4" class="outline fill-dark" />
    <circle cx="187" cy="403" r="4" class="outline fill-dark" />
  </g>

  <!-- CHARACTER -->
  <g id="character">
    <!-- Legs (Purple Trousers) -->
    <!-- Back leg (left leg) -->
    <path d="M 175 220 L 225 220 C 235 220 240 230 240 245 L 235 340 L 205 340 L 210 255 L 175 255 Z" class="outline fill-purple" />
    <!-- Front leg (right leg) -->
    <path d="M 185 220 L 250 220 C 265 220 272 230 270 250 L 260 370 L 228 370 L 238 250 L 185 245 Z" class="outline fill-purple" />
    <!-- Pants fold crease lines -->
    <line x1="230" y1="280" x2="238" y2="283" class="thin-line" />
    <line x1="225" y1="330" x2="235" y2="333" class="thin-line" />

    <!-- Shoes (White sneakers with black sole) -->
    <!-- Back shoe -->
    <path d="M 205 340 L 235 340 L 245 355 L 200 355 Z" class="outline fill-white" />
    <path d="M 198 355 L 248 355 L 248 360 L 198 360 Z" class="outline fill-dark" />

    <!-- Front shoe -->
    <path d="M 228 370 L 260 370 L 275 390 L 225 390 Z" class="outline fill-white" />
    <!-- Front shoe sole -->
    <path d="M 223 390 L 280 390 L 280 396 L 223 396 Z" class="outline fill-dark" />
    <!-- Front shoe lace curve -->
    <path d="M 245 373 Q 252 376 256 373" class="thin-line fill-none" />

    <!-- Body / Torso (Black sweater) -->
    <path d="M 135 155 C 135 130 160 115 190 115 C 205 115 225 125 225 155 L 220 230 L 150 230 Z" class="outline fill-dark" />
    <!-- Sweater wrinkles -->
    <path d="M 160 185 Q 175 190 185 185" class="thin-line fill-none" stroke="#FFFFFF" />
    <path d="M 155 210 Q 170 215 180 210" class="thin-line fill-none" stroke="#FFFFFF" />

    <!-- Head & Neck -->
    <!-- Neck -->
    <path d="M 175 105 L 175 125 L 195 125 L 195 105 Z" class="outline fill-white" />
    <line x1="175" y1="120" x2="195" y2="120" class="thin-line" />

    <!-- Head oval -->
    <path d="M 170 65 C 170 45 185 40 205 40 C 225 40 235 55 235 75 C 235 95 215 108 195 108 C 175 108 170 90 170 65 Z" class="outline fill-white" />

    <!-- Facial details -->
    <!-- Eye (side profile arc) -->
    <path d="M 207 72 Q 212 70 215 73" class="outline fill-none" />
    <!-- Eyebrow -->
    <path d="M 205 65 Q 212 63 217 66" class="thin-line fill-none" />
    <!-- Nose -->
    <path d="M 220 74 L 223 79 L 218 80" class="thin-line fill-none" />
    <!-- Smile -->
    <path d="M 208 88 Q 215 92 218 88" class="thin-line fill-none" />
    <!-- Ear -->
    <path d="M 180 70 C 176 70 176 78 180 82 C 183 82 184 76 181 74" class="thin-line fill-white" />

    <!-- Hair (Black vector styling) -->
    <path d="M 172 65 C 170 45 182 35 205 35 C 225 35 238 45 238 60 C 238 63 234 65 232 63 C 230 52 220 45 208 45 C 195 45 185 55 180 68 C 176 70 173 68 172 65 Z" class="outline fill-dark" />
    <!-- Front wave / hair fringe -->
    <path d="M 208 45 C 215 48 222 55 220 62 C 215 58 210 52 205 52 Z" class="outline fill-dark" />
    <path d="M 170 60 C 165 75 168 85 174 88 L 175 75 Z" class="outline fill-dark" />

    <!-- Arms & Hands typing -->
    <!-- Left arm (back) -->
    <path d="M 180 140 L 230 175 L 270 185 L 265 195 L 220 188 L 175 155 Z" class="outline fill-dark" />
    <!-- Left hand on keyboard -->
    <path d="M 268 185 C 275 185 282 188 285 192 L 272 196 Z" class="outline fill-white" />

    <!-- Right arm (front) -->
    <path d="M 195 135 C 205 135 225 155 240 180 L 285 188 L 282 200 L 230 195 L 188 150 Z" class="outline fill-dark" />
    <!-- Right hand fingers typing -->
    <path d="M 283 190 C 290 190 298 193 300 197 C 296 200 288 200 282 198 Z" class="outline fill-white" />
  </g>

  <!-- DESK & PROPS -->
  <g id="desk-and-accessories">
    <!-- Desk Surface (Thick clean tabletop with lavender tone) -->
    <rect x="65" y="195" width="350" height="14" rx="4" class="outline fill-purple-light" />
    
    <!-- Desk Legs -->
    <!-- Front Left Leg -->
    <rect x="80" y="209" width="10" height="251" class="outline fill-purple-light" />
    <line x1="85" y1="209" x2="85" y2="460" class="thin-line" stroke="#9468E8" />
    
    <!-- Back Left Leg -->
    <rect x="135" y="209" width="8" height="251" class="outline fill-purple-light" />

    <!-- Back Right Leg -->
    <rect x="360" y="209" width="8" height="251" class="outline fill-purple-light" />

    <!-- Front Right Leg -->
    <rect x="390" y="209" width="10" height="251" class="outline fill-purple-light" />
    <line x1="395" y1="209" x2="395" y2="460" class="thin-line" stroke="#9468E8" />

    <!-- Desk Crossbar -->
    <line x1="85" y1="230" x2="395" y2="230" class="thin-line" />

    <!-- Coffee Mug on left -->
    <rect x="108" y="172" width="18" height="23" rx="3" class="outline fill-white" />
    <!-- Handle -->
    <path d="M 108 178 C 100 178 100 190 108 190" class="outline fill-none" />
    <!-- Coffee liquid -->
    <line x1="112" y1="176" x2="122" y2="176" class="thin-line" stroke="#9468E8" />
    <!-- Steam wisps -->
    <path d="M 114 165 Q 112 158 116 152" class="thin-line fill-none" stroke="#9468E8" />
    <path d="M 120 167 Q 123 160 119 155" class="thin-line fill-none" stroke="#9468E8" />

    <!-- LAPTOP -->
    <!-- Laptop Base -->
    <path d="M 270 195 L 345 195 L 340 190 L 275 190 Z" class="outline fill-dark" />
    <!-- Laptop Screen (Angled open, facing user) -->
    <path d="M 280 190 L 325 130 L 375 130 L 340 190 Z" class="outline fill-dark" />
    <!-- Screen display face (purple/white glow) -->
    <path d="M 285 187 L 327 134 L 368 134 L 336 187 Z" class="outline fill-white" />
    <!-- Code / content lines on screen -->
    <line x1="305" y1="175" x2="340" y2="150" class="thin-line" stroke="#9468E8" />
    <line x1="315" y1="180" x2="350" y2="155" class="thin-line" stroke="#9468E8" />
    <line x1="325" y1="184" x2="360" y2="160" class="thin-line" stroke="#C9B4F8" />
    <!-- Laptop back Apple-like dot / circle logo on outer lid -->
    <circle cx="345" cy="155" r="4" fill="#9468E8" />

    <!-- Plant Pot on Right -->
    <!-- Pot -->
    <path d="M 365 180 L 385 180 L 382 195 L 368 195 Z" class="outline fill-purple-mid" />
    <!-- Succulent leaves -->
    <path d="M 375 180 C 370 170 372 165 375 162 C 378 165 380 170 375 180 Z" class="outline fill-purple" />
    <path d="M 371 180 C 363 175 365 168 370 168 C 372 172 373 176 371 180 Z" class="outline fill-purple-light" />
    <path d="M 379 180 C 387 175 385 168 380 168 C 378 172 377 176 379 180 Z" class="outline fill-purple-light" />
  </g>
</svg>
