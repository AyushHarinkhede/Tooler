<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <style>
      .char-line { stroke: #1E2235; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .char-thin { stroke: #1E2235; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .char-dark { fill: #1E2235; stroke: #1E2235; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
      .char-skin { fill: #FEE8DE; stroke: #1E2235; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
      .char-pants { fill: var(--char-accent, #9468E8); stroke: #1E2235; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
      .char-pants-back { fill: #7E4EE0; stroke: #1E2235; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
      .char-white { fill: #FFFFFF; stroke: #1E2235; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
      .char-accent-light { fill: #EDE9FE; stroke: #1E2235; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      .char-prop-bg { fill: #F4F1F8; stroke: #1E2235; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- Ambient Floating Accents -->
  <circle cx="45" cy="85" r="4.5" fill="#9468E8" />
  <circle cx="165" cy="45" r="3.0" fill="#C8B6FA" />
  <circle cx="178" cy="65" r="2.0" fill="#1E2235" />
  <circle cx="310" cy="80" r="2.5" fill="#1E2235" />
  <circle cx="360" cy="115" r="3.5" fill="#C8B6FA" />
  
  <!-- Mini 3x3 dot matrix -->
  <g fill="#C8B6FA">
    <circle cx="305" cy="175" r="1.8" /><circle cx="312" cy="175" r="1.8" /><circle cx="319" cy="175" r="1.8" />
    <circle cx="305" cy="182" r="1.8" /><circle cx="312" cy="182" r="1.8" /><circle cx="319" cy="182" r="1.8" />
    <circle cx="305" cy="189" r="1.8" /><circle cx="312" cy="189" r="1.8" /><circle cx="319" cy="189" r="1.8" />
  </g>

  <!-- Floor Baseline -->
  <line x1="20" y1="340" x2="380" y2="340" class="char-line" />

  <!-- Foliage / Plants at Base Behind Chair -->
  <path class="char-accent-light" d="M 35 340 C 30 300, 45 270, 60 280 C 75 290, 70 340, 70 340 Z" />
  <path class="char-accent-light" d="M 50 340 C 55 310, 80 295, 90 310 C 95 320, 85 340, 85 340 Z" />
  <path class="char-thin" d="M 50 340 Q 55 305 60 280" />
  <path class="char-thin" d="M 68 340 Q 75 320 85 305" />

  <!-- Office Chair -->
  <!-- Backrest -->
  <rect x="62" y="170" width="14" height="60" rx="7" class="char-accent-light" />
  <line x1="69" y1="230" x2="69" y2="250" class="char-line" />
  <!-- Seat Cushion -->
  <rect x="66" y="245" width="68" height="13" rx="6.5" class="char-accent-light" />
  <!-- Piston Stem & Height Adjustment Lever -->
  <line x1="95" y1="258" x2="95" y2="315" class="char-line" />
  <line x1="95" y1="270" x2="80" y2="270" class="char-line" />
  <circle cx="78" cy="270" r="3" fill="#1E2235" />
  <!-- Star Base & Casters -->
  <path class="char-line" d="M 60 332 L 95 315 L 130 332" />
  <line x1="95" y1="315" x2="95" y2="335" class="char-line" />
  <circle cx="58" cy="335" r="4.5" fill="#1E2235" />
  <circle cx="95" cy="336" r="4.5" fill="#1E2235" />
  <circle cx="132" cy="335" r="4.5" fill="#1E2235" />

  <!-- Legs & Trousers -->
  <!-- Far Leg (Shadow tone) -->
  <path class="char-pants-back" d="M 105 235 L 165 235 C 175 235, 178 242, 176 254 L 168 300 C 167 312, 173 316, 184 316 L 202 316 C 210 316, 212 308, 211 300 L 206 250 C 204 238, 194 226, 178 226 L 120 226 Z" />
  <!-- Near Leg (Bright Theme Tone) -->
  <path class="char-pants" d="M 90 235 L 150 235 C 160 235, 164 242, 162 254 L 153 300 C 152 312, 158 316, 168 316 L 186 316 C 195 316, 197 308, 196 300 L 190 250 C 188 238, 178 226, 160 226 L 105 226 Z" />
  <!-- Crease fold at knee -->
  <path class="char-thin" d="M 160 244 Q 157 252 160 260" />
  <path class="char-thin" d="M 152 292 Q 157 296 164 294" />

  <!-- White Sneakers with Black Sole -->
  <!-- Back Sneaker -->
  <path class="char-white" d="M 184 316 L 200 316 C 208 316, 218 322, 238 335 C 242 338, 240 340, 232 340 L 190 340 C 184 340, 182 335, 182 328 Z" />
  <line x1="184" y1="337" x2="236" y2="337" class="char-line" />
  <!-- Front Sneaker -->
  <path class="char-white" d="M 168 316 L 184 316 C 192 316, 202 322, 222 335 C 226 338, 224 340, 216 340 L 174 340 C 168 340, 166 335, 166 328 Z" />
  <line x1="168" y1="337" x2="220" y2="337" class="char-line" />

  <!-- Torso & Black Sweater -->
  <path class="char-dark" d="M 75 218 C 70 196, 80 162, 100 150 C 114 140, 130 142, 138 152 C 144 158, 146 182, 144 218 Z" />
  <!-- White Collar Under Sweater -->
  <path class="char-white" d="M 125 147 L 135 156 L 138 147 Z" />

  <!-- Head & Face Profile -->
  <!-- Neck -->
  <path class="char-skin" d="M 124 145 L 136 145 L 136 128 L 124 130 Z" />
  <!-- Head & Jaw -->
  <path class="char-skin" d="M 122 130 C 122 130, 118 112, 126 100 C 136 86, 154 86, 162 98 C 168 106, 166 116, 164 120 L 158 122 C 158 128, 150 134, 140 134 C 130 134, 124 132, 122 130 Z" />
  <!-- Ear -->
  <ellipse cx="130" cy="116" rx="4.5" ry="6" class="char-skin" />
  <path class="char-thin" d="M 130 114 Q 132 116 130 118" />
  <!-- Eye & Eyebrow -->
  <path class="char-thin" d="M 148 106 Q 152 105 155 107" />
  <circle cx="152" cy="111" r="1.5" fill="#1E2235" />
  <!-- Nose Tip -->
  <path class="char-thin" d="M 158 111 L 163 114 L 158 117" />
  <!-- Smile -->
  <path class="char-thin" d="M 152 122 Q 156 123 159 120" />
  <!-- Stylish Dark Hair -->
  <path class="char-dark" d="M 122 112 C 118 102, 122 88, 134 80 C 146 72, 164 74, 170 86 C 174 94, 172 104, 164 104 C 158 104, 156 98, 148 96 C 140 94, 132 98, 128 108 Z" />
  <path class="char-dark" d="M 166 94 C 170 96, 172 102, 166 106 C 160 110, 156 108, 156 104 Z" />

  <!-- Arms & Hands Typing on Laptop -->
  <!-- Left Arm (Behind) -->
  <path class="char-dark" d="M 112 154 C 118 162, 132 176, 152 180 L 195 186 C 205 188, 208 184, 204 178 L 180 172 C 164 168, 144 158, 132 150 Z" />
  <!-- Right Arm (Front) -->
  <path class="char-dark" d="M 95 155 C 85 158, 80 172, 82 188 C 84 198, 92 202, 102 198 L 175 182 C 185 180, 187 174, 182 168 L 140 166 C 130 164, 120 156, 110 148 Z" />
  <!-- Hands on Keyboard -->
  <path class="char-skin" d="M 194 184 C 198 184, 206 182, 212 186 C 214 188, 212 190, 206 190 L 190 190 Z" />
  <path class="char-skin" d="M 174 180 C 178 180, 186 178, 192 182 C 194 184, 192 186, 186 186 L 170 186 Z" />
  <!-- Sleeve Cuffs -->
  <line x1="174" y1="178" x2="176" y2="186" class="char-thin" />
  <line x1="192" y1="182" x2="194" y2="190" class="char-thin" />

  <!-- Modern Desk -->
  <!-- Beveled Table Top -->
  <rect x="70" y="196" width="280" height="12" rx="3" class="char-prop-bg" />
  <!-- Desk Legs -->
  <rect x="85" y="208" width="10" height="132" rx="2" class="char-prop-bg" />
  <rect x="325" y="208" width="10" height="132" rx="2" class="char-prop-bg" />
  <!-- Crossbar -->
  <line x1="95" y1="300" x2="325" y2="300" class="char-thin" />

  <!-- Open Laptop -->
  <!-- Screen Base / Keyboard -->
  <polygon points="190,196 248,196 242,188 196,188" class="char-prop-bg" />
  <!-- Angled Screen Lid -->
  <polygon points="242,188 266,138 226,138 202,188" class="char-prop-bg" />
  <line x1="230" y1="140" x2="260" y2="140" class="char-thin" />
  <!-- Screen Glow / Trackpad -->
  <polygon points="238,184 260,142 230,142 208,184" class="char-accent-light" />
  <rect x="214" y="191" width="14" height="4" rx="1" class="char-thin" />

  <!-- Steaming Coffee Mug (Left side of desk) -->
  <rect x="110" y="174" width="18" height="22" rx="3" class="char-accent-light" />
  <path class="char-line" d="M 110 180 C 102 180, 102 190, 110 190" />
  <!-- Steam Wisps -->
  <path class="char-thin" d="M 114 168 Q 116 162 113 156 Q 116 150 114 144" />
  <path class="char-thin" d="M 122 168 Q 124 162 121 156 Q 124 150 122 144" />

  <!-- Potted Succulent Plant (Right side of desk) -->
  <polygon points="300,196 316,196 313,180 303,180" class="char-accent-light" />
  <!-- Petals -->
  <path class="char-dark" d="M 308 180 C 304 172, 304 164, 308 160 C 312 164, 312 172, 308 180 Z" />
  <path class="char-dark" d="M 304 176 C 298 172, 296 166, 300 164 C 304 166, 306 172, 304 176 Z" />
  <path class="char-dark" d="M 312 176 C 318 172, 320 166, 316 164 C 312 166, 310 172, 312 176 Z" />
</svg>
