    .hair-dark { fill: #181829; stroke: #181829; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
    .sweater-dark { fill: #181829; stroke: #181829; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
