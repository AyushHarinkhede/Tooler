<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <style>
      .char-line { stroke: #1E2235; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .char-thin { stroke: #1E2235; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .char-dark { fill: #1E2235; stroke: #1E2235; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
      .char-skin { fill: #FEE8DE; stroke: #1E2235; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
      .char-pants { fill: var(--char-accent, #9468E8); stroke: #1E2235; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
      .char-pants-back { fill: #7E4EE0; stroke: #1E2235; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
      .char-white { fill: #FFFFFF; stroke: #1E2235; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
      .char-accent-light { fill: #EDE9FE; stroke: #1E2235; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      .char-prop-bg { fill: #F8F7FC; stroke: #1E2235; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- Ambient Floating Accents -->
  <circle cx="280" cy="55" r="3.0" fill="#1E2235" />
  <circle cx="340" cy="85" r="4.0" fill="#9468E8" />
  <circle cx="50" cy="140" r="2.5" fill="#1E2235" />
  <polygon points="360,180 366,183 360,186" fill="#C8B6FA" />

  <!-- Floor Baseline -->
  <line x1="20" y1="340" x2="380" y2="340" class="char-line" />

  <!-- Foliage / Plants at Base -->
  <path class="char-accent-light" d="M 330 340 C 335 305, 360 285, 375 300 C 385 310, 375 340, 375 340 Z" />
  <path class="char-line" d="M 355 340 Q 360 315 358 295" />

  <!-- Tripod Flipchart Easel -->
  <!-- Back Leg of Easel -->
  <line x1="130" y1="130" x2="160" y2="340" class="char-line" />
  <!-- Left Leg -->
  <line x1="120" y1="130" x2="65" y2="340" class="char-line" />
  <!-- Right Leg -->
  <line x1="140" y1="130" x2="195" y2="340" class="char-line" />
  <!-- Cross Shelf / Pen Bar -->
  <line x1="68" y1="270" x2="192" y2="270" class="char-line" />

  <!-- Paper Board Canvas -->
  <rect x="75" y="105" width="110" height="155" rx="5" class="char-prop-bg" />
  <!-- Top Paper Roll Clamp -->
  <rect x="70" y="95" width="120" height="12" rx="3" class="char-accent-light" />

  <!-- Presentation Visuals: Rising Curve Chart -->
  <!-- Coordinate Axis -->
  <line x1="90" y1="190" x2="168" y2="190" class="char-thin" />
  <line x1="90" y1="140" x2="90" y2="190" class="char-thin" />
  <!-- Exponential Growth Curve with Shaded Area -->
  <path class="char-accent-light" d="M 92 188 C 105 188, 120 182, 135 165 C 148 150, 155 142, 166 142 L 166 188 Z" />
  <path class="char-line" d="M 92 188 C 105 188, 120 182, 135 165 C 148 150, 155 142, 166 142" />

  <!-- Pie Chart & Metric Lines -->
  <circle cx="115" cy="225" r="16" class="char-prop-bg" />
  <!-- Pie Slice -->
  <path class="char-pants" d="M 115 225 L 115 209 A 16 16 0 0 1 131 225 Z" />
  <!-- Legend Lines -->
  <line x1="140" y1="216" x2="168" y2="216" class="char-thin" />
  <line x1="140" y1="225" x2="162" y2="225" class="char-thin" />
  <line x1="140" y1="234" x2="155" y2="234" class="char-thin" />

  <!-- Standing Presenter Character -->
  <!-- Left Leg (Far) -->
  <path class="char-pants-back" d="M 292 205 L 302 205 C 306 235, 308 285, 308 315 L 292 315 C 290 285, 290 235, 292 205 Z" />
  <!-- Right Leg (Near) -->
  <path class="char-pants" d="M 306 205 L 336 205 C 334 235, 332 285, 330 315 L 310 315 C 312 285, 314 235, 306 205 Z" />
  <path class="char-thin" d="M 312 250 Q 316 255 320 252" />

  <!-- White Sneakers -->
  <path class="char-white" d="M 292 315 L 306 315 C 312 315, 316 322, 322 335 C 324 338, 322 340, 316 340 L 288 340 C 284 340, 285 335, 287 326 Z" />
  <line x1="288" y1="337" x2="320" y2="337" class="char-line" />
  <path class="char-white" d="M 310 315 L 328 315 C 334 315, 340 322, 348 335 C 350 338, 348 340, 342 340 L 306 340 C 302 340, 303 335, 305 326 Z" />
  <line x1="306" y1="337" x2="346" y2="337" class="char-line" />

  <!-- Torso & Black Sweater -->
  <path class="char-dark" d="M 288 140 C 278 150, 276 180, 282 208 L 338 208 C 342 180, 338 150, 330 140 Z" />
  <path class="char-white" d="M 306 132 L 312 140 L 318 132 Z" />

  <!-- Head & Face Profile -->
  <path class="char-skin" d="M 306 130 L 318 130 L 318 118 L 306 118 Z" />
  <path class="char-skin" d="M 302 118 C 302 118, 298 102, 306 90 C 314 78, 330 78, 338 90 C 342 96, 342 106, 340 110 L 336 112 C 336 118, 329 124, 320 124 C 310 124, 304 122, 302 118 Z" />
  <ellipse cx="308" cy="106" rx="4" ry="5.5" class="char-skin" />
  <path class="char-thin" d="M 308 104 Q 310 106 308 108" />
  <circle cx="328" cy="101" r="1.5" fill="#1E2235" />
  <path class="char-thin" d="M 326 97 Q 329 96 332 98" />
  <path class="char-thin" d="M 333 103 L 338 105 L 333 108" />
  <path class="char-thin" d="M 328 113 Q 332 114 335 111" />
  <path class="char-dark" d="M 302 104 C 298 94, 302 80, 312 74 C 322 66, 340 68, 346 80 C 350 88, 348 98, 340 98 C 334 98, 332 92, 324 90 C 316 88, 310 92, 306 100 Z" />

  <!-- Arms -->
  <!-- Left Arm (Pointing with finger at chart) -->
  <path class="char-dark" d="M 298 142 C 285 146, 260 152, 235 152 L 180 155 C 172 155, 170 148, 174 144 L 186 138 C 196 134, 218 136, 235 136 L 290 134 Z" />
  <!-- Hand Pointing Finger -->
  <path class="char-skin" d="M 174 144 C 168 144, 160 144, 155 145 C 153 146, 153 148, 158 148 L 174 150 Z" />
  <!-- Right Arm (Hand in pocket) -->
  <path class="char-dark" d="M 328 142 C 336 150, 340 168, 338 185 L 332 208 C 330 214, 324 216, 320 210 L 324 195 C 326 178, 324 160, 320 150 Z" />
</svg>
