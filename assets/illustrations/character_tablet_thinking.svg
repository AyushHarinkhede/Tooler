  <!-- Left Hand Cuff (White) -->
  <polygon points="175,204 182,205 180,212 173,211" fill="#FFFFFF" stroke="#1E2235" stroke-width="1.8" />
  <!-- Left Hand (Skin) Holding Tablet Base -->
  <ellipse cx="186" cy="210" rx="5" ry="4" fill="#FEE8DE" stroke="#1E2235" stroke-width="1.8" />

  <!-- Tablet Computer (Tilted in hands) -->
  <rect x="175" y="170" width="40" height="50" rx="4" transform="rotate(18 175 170)" fill="#1E2235" stroke="#1E2235" stroke-width="2.2" />
  <rect x="178" y="173" width="34" height="44" rx="2" transform="rotate(18 175 170)" fill="#EDE9FE" stroke="#1E2235" stroke-width="1.5" />

  <!-- Right Arm (Raised to Chin in Thinking Pose) -->
  <path fill="#1E2235" stroke="#1E2235" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M 115 160 C 125 170, 145 180, 162 170 L 158 140 C 155 132, 148 130, 145 135 L 140 152 Z" />
  <!-- Right Hand Cuff (White) -->
