  <!-- Face Profile (Facing right) -->
  <path fill="#FEE8DE" stroke="#1E2235" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" d="M 118 134 C 118 134, 114 116, 122 104 C 132 90, 150 90, 158 102 C 164 110, 162 120, 160 124 L 154 126 C 154 132, 146 138, 136 138 C 126 138, 120 136, 118 134 Z" />
