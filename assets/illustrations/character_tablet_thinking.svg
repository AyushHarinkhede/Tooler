  <path fill="#FEE8DE" stroke="#1E2235" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" d="M 152 135 C 150 130, 154 125, 160 126 C 164 127, 163 133, 160 136 Z" />

