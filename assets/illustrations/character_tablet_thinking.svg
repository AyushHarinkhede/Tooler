  <path fill="#FFFFFF" stroke="#1E2235" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" d="M 235 110 L 285 110 C 290 110, 294 114, 294 119 L 294 140 C 294 145, 290 149, 285 149 L 255 149 L 245 158 L 248 149 L 235 149 C 230 149, 226 145, 226 140 L 226 119 C 226 114, 230 110, 235 110 Z" />
  <line x1="236" y1="122" x2="284" y2="122" stroke="#9468E8" stroke-width="1.5" stroke-linecap="round" />
  <line x1="236" y1="130" x2="274" y2="130" stroke="#9468E8" stroke-width="1.5" stroke-linecap="round" />
  <line x1="236" y1="138" x2="260" y2="138" stroke="#9468E8" stroke-width="1.5" stroke-linecap="round" />
</svg>