<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <style>
      .char-line { stroke: #1E2235; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .char-thin { stroke: #1E2235; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .char-dark { fill: #1E2235; stroke: #1E2235; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
      .char-skin { fill: #FEE8DE; stroke: #1E2235; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
      .char-pants { fill: var(--char-accent, #9468E8); stroke: #1E2235; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
      .char-pants-back { fill: #7E4EE0; stroke: #1E2235; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
      .char-white { fill: #FFFFFF; stroke: #1E2235; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
      .char-accent-light { fill: #EDE9FE; stroke: #1E2235; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      .char-prop-bg { fill: #F8F7FC; stroke: #1E2235; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- Ambient Floating Accents -->
  <circle cx="215" cy="55" r="3.0" fill="#1E2235" />
  <circle cx="340" cy="95" r="4.0" fill="#9468E8" />
  <circle cx="55" cy="180" r="2.5" fill="#1E2235" />
  <polygon points="230,165 236,168 230,171" fill="#C8B6FA" />
  <!-- Zigzag Spark -->
  <path class="char-thin" d="M 45 220 L 52 225 L 59 220 L 66 225" />

  <!-- Floor Baseline -->
  <line x1="20" y1="340" x2="380" y2="340" class="char-line" />

  <!-- Plant at Bottom Right -->
  <path class="char-accent-light" d="M 270 340 C 265 295, 290 270, 310 285 C 325 300, 315 340, 315 340 Z" />
  <path class="char-accent-light" d="M 285 340 C 295 305, 320 290, 332 305 C 340 318, 328 340, 328 340 Z" />
  <path class="char-thin" d="M 285 340 Q 295 295 308 285" />
  <path class="char-thin" d="M 305 340 Q 315 315 328 305" />

  <!-- Floating Thought Bubble -->
  <rect x="175" y="90" width="46" height="28" rx="8" class="char-prop-bg" />
  <path class="char-prop-bg" d="M 185 118 L 180 128 L 195 118 Z" />
  <line x1="184" y1="99" x2="212" y2="99" class="char-thin" />
  <line x1="184" y1="106" x2="204" y2="106" class="char-thin" />

  <!-- Executive High-Back Chair -->
  <!-- Chair Back Frame & Padding -->
  <rect x="42" y="160" width="60" height="110" rx="14" class="char-prop-bg" />
  <rect x="50" y="170" width="44" height="90" rx="8" class="char-accent-light" />
  <!-- Armrest -->
  <path class="char-line" d="M 62 230 C 62 215, 96 215, 102 230 L 102 260" />
  <!-- Seat Cushion -->
  <rect x="52" y="260" width="65" height="15" rx="6" class="char-prop-bg" />
  <!-- Chair Base, Pneumatic Lever & Casters -->
  <line x1="84" y1="275" x2="84" y2="315" class="char-line" />
  <line x1="84" y1="285" x2="68" y2="285" class="char-line" />
  <circle cx="66" cy="285" r="3" fill="#1E2235" />
  <path class="char-line" d="M 48 332 L 84 315 L 120 332" />
  <line x1="84" y1="315" x2="84" y2="335" class="char-line" />
  <circle cx="46" cy="336" r="4.5" fill="#1E2235" />
  <circle cx="84" cy="336" r="4.5" fill="#1E2235" />
  <circle cx="122" cy="336" r="4.5" fill="#1E2235" />

  <!-- Legs Crossed at Ankle in Trousers -->
  <!-- Bottom Leg (Far) -->
  <path class="char-pants-back" d="M 98 250 L 150 250 C 160 250, 168 256, 172 268 L 195 315 C 200 324, 206 325, 214 322 L 225 318 C 230 316, 230 310, 226 304 L 198 260 C 190 248, 178 238, 162 238 L 115 238 Z" />
  <!-- Top Leg (Near, Crossed over top of knee) -->
  <path class="char-pants" d="M 86 248 L 140 248 C 152 248, 164 240, 178 226 L 222 188 C 230 182, 236 186, 240 196 L 255 242 C 258 252, 266 256, 276 256 L 285 256 C 292 256, 294 250, 292 242 L 282 205 C 276 185, 260 174, 240 174 C 220 174, 195 190, 170 215 L 135 240 Z" />
  <path class="char-thin" d="M 230 190 Q 236 198 232 206" />

  <!-- White Sneakers -->
  <!-- Top Sneaker (Angled down) -->
  <path class="char-white" d="M 276 256 L 290 256 C 298 256, 305 264, 318 280 C 322 284, 320 286, 312 286 L 272 286 C 266 286, 268 278, 270 268 Z" />
  <line x1="272" y1="283" x2="316" y2="283" class="char-line" />
  <!-- Bottom Sneaker -->
  <path class="char-white" d="M 214 322 L 228 322 C 235 322, 240 326, 252 336 C 255 338, 252 340, 246 340 L 210 340 C 205 340, 206 335, 208 328 Z" />
  <line x1="210" y1="337" x2="250" y2="337" class="char-line" />

  <!-- Torso & Black Sweater (Reclining slightly back) -->
  <path class="char-dark" d="M 70 230 C 64 200, 72 165, 94 150 C 108 140, 126 142, 134 154 C 140 162, 142 195, 138 232 Z" />
  <!-- White Collar -->
  <path class="char-white" d="M 118 148 L 126 156 L 132 148 Z" />

  <!-- Head & Face Profile (Tilted in thought) -->
  <!-- Neck -->
  <path class="char-skin" d="M 118 145 L 130 145 L 128 128 L 116 130 Z" />
  <!-- Head & Jaw -->
  <path class="char-skin" d="M 114 128 C 114 128, 110 110, 118 98 C 128 84, 146 84, 154 96 C 160 104, 158 114, 156 118 L 150 120 C 150 126, 142 132, 132 132 C 122 132, 116 130, 114 128 Z" />
  <!-- Ear -->
  <ellipse cx="122" cy="114" rx="4" ry="5.5" class="char-skin" />
  <path class="char-thin" d="M 122 112 Q 124 114 122 116" />
  <!-- Thoughtful Eye & Brow -->
  <path class="char-thin" d="M 138 104 Q 142 102 145 104" />
  <circle cx="142" cy="108" r="1.5" fill="#1E2235" />
  <!-- Nose Tip -->
  <path class="char-thin" d="M 148 109 L 153 111 L 148 114" />
  <!-- Mouth (Thoughtful flat line) -->
  <line x1="144" y1="119" x2="149" y2="119" class="char-thin" />
  <!-- Dark Hair -->
  <path class="char-dark" d="M 114 110 C 110 100, 114 86, 126 78 C 138 70, 156 72, 162 84 C 166 92, 164 102, 156 102 C 150 102, 148 96, 140 94 C 132 92, 124 96, 120 106 Z" />

  <!-- Arms -->
  <!-- Left Arm: Hand on Chin in Thought -->
  <path class="char-dark" d="M 88 155 C 80 165, 78 185, 84 204 L 98 206 C 104 206, 108 202, 108 196 L 118 168 C 122 156, 130 148, 138 140 L 132 135 C 122 140, 110 146, 102 155 Z" />
  <!-- Hand Touching Chin -->
  <path class="char-skin" d="M 132 135 C 136 132, 142 128, 145 125 C 146 123, 144 122, 140 124 L 134 128 Z" />
  <!-- Right Arm: Holding Tablet -->
  <path class="char-dark" d="M 116 156 C 124 165, 138 178, 152 182 L 180 186 C 188 188, 192 184, 188 178 L 168 172 C 154 168, 142 158, 134 150 Z" />
  <!-- Hand Holding Tablet -->
  <path class="char-skin" d="M 180 184 C 185 184, 192 182, 196 186 C 198 188, 196 190, 190 190 L 178 190 Z" />
  <!-- Sleek Modern Tablet -->
  <rect x="185" y="150" width="40" height="55" rx="4" transform="rotate(-15, 185, 150)" class="char-prop-bg" />
  <rect x="189" y="154" width="32" height="47" rx="2" transform="rotate(-15, 185, 150)" class="char-accent-light" />
  <circle cx="204" cy="198" r="2" fill="#1E2235" />
</svg>
