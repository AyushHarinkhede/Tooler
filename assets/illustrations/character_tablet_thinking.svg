  <path fill="none" stroke="#1E2235" stroke-width="1.5" stroke-linecap="round" d="M 144 110 Q 148 109 152 111" />
  <circle cx="148" cy="115" r="1.5" fill="#1E2235" />
  <path fill="none" stroke="#1E2235" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" d="M 154 115 L 159 118 L 154 121" />
  <path fill="none" stroke="#1E2235" stroke-width="1.5" stroke-linecap="round" d="M 146 126 Q 150 128 154 125" />

