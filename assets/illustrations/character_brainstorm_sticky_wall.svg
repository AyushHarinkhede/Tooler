<svg viewBox="0 0 500 550" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <style>
    .outline { stroke: #23233A; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .thin-line { stroke: #23233A; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .fill-dark { fill: #23233A; }
    .fill-purple { fill: #9468E8; }
    .fill-purple-light { fill: #ECE5FC; }
    .fill-purple-mid { fill: #C9B4F8; }
    .fill-white { fill: #FFFFFF; }
    .fill-none { fill: none; }
  </style>

  <!-- Ambient accents -->
  <circle cx="215" cy="45" r="3" fill="#9468E8" />
  <circle cx="430" cy="180" r="2.5" fill="#23233A" />
  <polygon points="440,140 446,148 434,148" class="thin-line fill-none" stroke="#9468E8" />

  <!-- Floor baseline -->
  <line x1="40" y1="460" x2="460" y2="460" class="outline" />

  <!-- BRAINSTORM BOARD WITH STICKY WEB -->
  <g id="brainstorm-board">
    <rect x="50" y="60" width="310" height="210" rx="8" class="outline fill-purple-light" />
    <rect x="58" y="68" width="294" height="194" rx="4" class="outline fill-white" />

    <!-- Sticky Notes Cluster -->
    <!-- Note 1 (Top Left) -->
    <rect x="75" y="85" width="30" height="28" rx="3" class="outline fill-purple-mid" />
    <line x1="80" y1="94" x2="98" y2="94" class="thin-line" stroke="#23233A" />
    <line x1="80" y1="100" x2="94" y2="100" class="thin-line" stroke="#23233A" />

    <!-- Note 2 (Middle Left) -->
    <rect x="88" y="140" width="32" height="30" rx="3" class="outline fill-purple" />
    <line x1="93" y1="148" x2="112" y2="148" class="thin-line" stroke="#FFFFFF" />
    <line x1="93" y1="154" x2="108" y2="154" class="thin-line" stroke="#FFFFFF" />

    <!-- Note 3 (Top Middle) -->
    <rect x="180" y="80" width="32" height="30" rx="3" class="outline fill-purple-light" />
    <line x1="185" y1="88" x2="204" y2="88" class="thin-line" stroke="#23233A" />

    <!-- Note 4 (Top Right) -->
    <rect x="290" y="85" width="32" height="30" rx="3" class="outline fill-purple" />
    <line x1="295" y1="93" x2="314" y2="93" class="thin-line" stroke="#FFFFFF" />

    <!-- Note 5 (Center Hub) -->
    <rect x="245" y="135" width="36" height="34" rx="3" class="outline fill-purple-mid" />
    <line x1="250" y1="144" x2="272" y2="144" class="thin-line" stroke="#23233A" />
    <line x1="250" y1="150" x2="268" y2="150" class="thin-line" stroke="#23233A" />
    <line x1="250" y1="156" x2="262" y2="156" class="thin-line" stroke="#23233A" />

    <!-- Note 6 (Bottom Right) -->
    <rect x="295" y="190" width="30" height="28" rx="3" class="outline fill-purple-light" />
    <line x1="300" y1="198" x2="318" y2="198" class="thin-line" stroke="#23233A" />

    <!-- Note 7 (Bottom Center) -->
    <rect x="195" y="195" width="30" height="28" rx="3" class="outline fill-purple-mid" />

    <!-- Note 8 (Being Placed by Character) -->
    <rect x="210" y="110" width="32" height="30" rx="3" class="outline fill-purple" />
    <line x1="216" y1="118" x2="234" y2="118" class="thin-line" stroke="#FFFFFF" />

    <!-- Network / Brainstorm Connection Lines -->
    <line x1="105" y1="100" x2="180" y2="95" class="thin-line" stroke="#9468E8" />
    <line x1="120" y1="155" x2="210" y2="125" class="thin-line" stroke="#9468E8" />
    <line x1="242" y1="125" x2="290" y2="100" class="thin-line" stroke="#9468E8" />
    <line x1="245" y1="150" x2="212" y2="125" class="thin-line" stroke="#9468E8" />
    <line x1="265" y1="170" x2="225" y2="195" class="thin-line" stroke="#9468E8" />
    <line x1="280" y1="155" x2="295" y2="195" class="thin-line" stroke="#9468E8" />
  </g>

  <!-- Foliage / Plants at Base -->
  <g id="plants-base">
    <path d="M 50 460 C 45 420 70 395 90 410 C 110 425 105 455 100 460 Z" class="outline fill-purple-light" />
    <path d="M 80 460 C 85 410 115 400 130 420 C 140 440 120 460 115 460 Z" class="outline fill-purple-mid" />
    <path d="M 405 460 C 400 415 425 385 445 405 C 465 425 450 455 440 460 Z" class="outline fill-purple-light" />
    <path d="M 425 460 C 430 425 450 415 460 430 C 465 445 455 460 450 460 Z" class="outline fill-purple" />
  </g>

  <!-- CHARACTER PLACING STICKY NOTE -->
  <g id="character-sticky">
    <!-- Legs (Purple Trousers, standing view from back/side) -->
    <!-- Left Leg -->
    <path d="M 175 270 L 170 425 L 198 425 L 202 270 Z" class="outline fill-purple" />
    <!-- Right Leg -->
    <path d="M 210 270 L 212 425 L 240 425 L 235 270 Z" class="outline fill-purple" />
    <path d="M 168 260 L 242 260 L 238 280 L 206 280 L 172 280 Z" class="outline fill-purple" />

    <!-- Shoes (White sneakers with black sole) -->
    <!-- Left Shoe -->
    <path d="M 162 445 L 200 445 L 200 425 L 170 425 Z" class="outline fill-white" />
    <path d="M 160 445 L 203 445 L 203 451 L 160 451 Z" class="outline fill-dark" />
    <!-- Right Shoe -->
    <path d="M 210 425 L 212 445 L 250 445 L 240 425 Z" class="outline fill-white" />
    <path d="M 208 445 L 253 445 L 253 451 L 208 451 Z" class="outline fill-dark" />

    <!-- Torso (Dark crewneck sweater, reaching up to board) -->
    <path d="M 165 155 C 165 135 188 125 205 125 C 222 125 245 135 245 155 L 242 268 L 168 268 Z" class="outline fill-dark" />
    <path d="M 185 195 Q 205 200 220 195" class="thin-line fill-none" stroke="#FFFFFF" />

    <!-- Neck & Head (Turned towards board) -->
    <path d="M 195 115 L 195 130 L 215 130 L 215 115 Z" class="outline fill-white" />
    <!-- Head -->
    <path d="M 185 75 C 185 55 198 45 215 45 C 232 45 245 58 245 78 C 245 98 230 115 212 115 C 192 115 185 95 185 75 Z" class="outline fill-white" />

    <!-- Face features (Profile turning right towards board) -->
    <circle cx="228" cy="76" r="2.5" fill="#23233A" />
    <path d="M 224 70 Q 230 67 234 70" class="thin-line fill-none" />
    <path d="M 235 78 L 238 83 L 232 84" class="thin-line fill-none" />
    <path d="M 224 92 Q 230 96 236 91" class="thin-line fill-none" />
    <path d="M 198 75 C 194 75 194 83 198 86 C 200 86 202 80 199 77" class="thin-line fill-white" />

    <!-- Hair -->
    <path d="M 188 72 C 186 55 196 42 215 42 C 235 42 248 52 248 68 C 248 72 243 74 240 70 C 238 58 228 50 215 50 C 205 50 198 58 196 68 C 193 72 190 73 188 72 Z" class="outline fill-dark" />
    <path d="M 215 50 C 205 55 198 65 198 72 C 202 65 210 58 218 56 Z" class="outline fill-dark" />
    <path d="M 240 68 C 248 80 242 90 236 92 L 236 82 Z" class="outline fill-dark" />

    <!-- Right Arm & Hand (Reaching Up, Sticking Note to Board) -->
    <path d="M 235 150 C 245 140 250 120 240 112 L 230 118 C 238 124 235 138 225 155 Z" class="outline fill-dark" />
    <!-- Hand placing note -->
    <path d="M 238 114 C 238 108 244 104 248 106 C 252 110 248 118 242 118 Z" class="outline fill-white" />
    <line x1="242" y1="108" x2="238" y2="114" class="thin-line" />

    <!-- Left Arm & Hand (Holding marker pen down at side) -->
    <path d="M 175 155 C 160 170 155 205 160 235 L 172 235 C 168 210 170 180 185 165 Z" class="outline fill-dark" />
    <path d="M 160 235 C 156 240 158 248 164 248 C 168 248 172 242 172 235 Z" class="outline fill-white" />
    <!-- Marker in hand -->
    <rect x="156" y="240" width="6" height="20" rx="2" class="outline fill-purple" />
    <polygon points="156,260 162,260 159,264" fill="#23233A" />
  </g>
</svg>
