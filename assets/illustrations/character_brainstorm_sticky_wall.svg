<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <style>
      .char-line { stroke: #1E2235; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .char-thin { stroke: #1E2235; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .char-dark { fill: #1E2235; stroke: #1E2235; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
      .char-skin { fill: #FEE8DE; stroke: #1E2235; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
      .char-pants { fill: var(--char-accent, #9468E8); stroke: #1E2235; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
      .char-pants-back { fill: #7E4EE0; stroke: #1E2235; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
      .char-white { fill: #FFFFFF; stroke: #1E2235; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
      .char-accent-light { fill: #EDE9FE; stroke: #1E2235; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      .char-sticky { fill: #DDD6FE; stroke: #1E2235; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      .char-prop-bg { fill: #F8F7FC; stroke: #1E2235; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- Ambient Floating Accents -->
  <circle cx="340" cy="55" r="3.0" fill="#1E2235" />
  <circle cx="35" cy="115" r="3.5" fill="#9468E8" />
  <polygon points="360,120 366,123 360,126" fill="#C8B6FA" />

  <!-- Floor Baseline -->
  <line x1="20" y1="340" x2="380" y2="340" class="char-line" />

  <!-- Wide Brainstorming Board on Wall -->
  <rect x="45" y="45" width="280" height="155" rx="4" class="char-prop-bg" />
  <rect x="40" y="200" width="290" height="6" rx="2" class="char-prop-bg" />

  <!-- Clustered Sticky Notes Network -->
  <!-- Cluster 1 (Left) -->
  <rect x="65" y="65" width="26" height="24" rx="2" class="char-sticky" />
  <line x1="68" y1="72" x2="88" y2="72" class="char-thin" />
  <rect x="100" y="65" width="26" height="20" rx="2" class="char-sticky" />
  <rect x="80" y="95" width="26" height="24" rx="2" class="char-sticky" />
  <!-- Cluster 2 (Center Web) -->
  <rect x="175" y="65" width="28" height="24" rx="2" class="char-sticky" />
  <rect x="145" y="85" width="28" height="26" rx="2" class="char-sticky" />
  <rect x="205" y="85" width="28" height="24" rx="2" class="char-sticky" />
  <rect x="170" y="115" width="30" height="28" rx="2" class="char-sticky" />
  <line x1="174" y1="123" x2="196" y2="123" class="char-thin" />
  <line x1="174" y1="129" x2="192" y2="129" class="char-thin" />
  <!-- Cluster 3 (Right) -->
  <rect x="260" y="68" width="28" height="24" rx="2" class="char-sticky" />
  <rect x="240" y="100" width="26" height="22" rx="2" class="char-sticky" />
  <rect x="265" y="130" width="28" height="24" rx="2" class="char-sticky" />

  <!-- Network Connectors -->
  <path class="char-thin" d="M 90 89 L 90 95" />
  <path class="char-thin" d="M 106 107 Q 125 105 145 98" />
  <path class="char-thin" d="M 173 89 L 189 77" />
  <path class="char-thin" d="M 173 98 L 205 97" />
  <path class="char-thin" d="M 185 115 L 189 89" />
  <path class="char-thin" d="M 233 97 Q 246 80 260 80" />
  <path class="char-thin" d="M 233 105 Q 248 118 265 135" />

  <!-- Base Foliage -->
  <path class="char-accent-light" d="M 270 340 C 275 305, 300 285, 315 300 C 325 310, 320 340, 320 340 Z" />
  <path class="char-accent-light" d="M 330 340 C 335 300, 360 280, 375 295 C 385 310, 370 340, 370 340 Z" />
  <path class="char-line" d="M 345 340 Q 350 310 345 285" />
  <path class="char-accent-light" d="M 45 340 C 40 310, 60 295, 75 305 C 80 320, 75 340, 75 340 Z" />

  <!-- Standing Character (Interacting with Sticky Wall) -->
  <!-- Left Leg (Far) -->
  <path class="char-pants-back" d="M 115 200 L 128 200 C 130 235, 130 285, 128 315 L 112 315 C 112 285, 114 235, 115 200 Z" />
  <!-- Right Leg (Near) -->
  <path class="char-pants" d="M 134 200 L 164 200 C 162 235, 160 285, 158 315 L 138 315 C 140 285, 142 235, 134 200 Z" />
  <path class="char-thin" d="M 144 248 Q 148 254 152 250" />

  <!-- White Sneakers -->
  <path class="char-white" d="M 112 315 L 128 315 C 134 315, 138 322, 144 335 C 146 338, 144 340, 138 340 L 108 340 C 104 340, 105 335, 107 326 Z" />
  <line x1="108" y1="337" x2="142" y2="337" class="char-line" />
  <path class="char-white" d="M 138 315 L 156 315 C 162 315, 168 322, 176 335 C 178 338, 176 340, 170 340 L 134 340 C 130 340, 131 335, 133 326 Z" />
  <line x1="134" y1="337" x2="174" y2="337" class="char-line" />

  <!-- Torso & Black Sweater -->
  <path class="char-dark" d="M 116 135 C 108 145, 105 175, 110 202 L 166 202 C 170 175, 166 145, 158 135 Z" />
  <path class="char-white" d="M 134 128 L 140 136 L 146 128 Z" />

  <!-- Head & Face (Looking Upwards Towards Sticky Wall) -->
  <path class="char-skin" d="M 134 126 L 146 126 L 146 114 L 134 114 Z" />
  <path class="char-skin" d="M 130 114 C 130 114, 126 98, 134 86 C 142 74, 158 74, 166 86 C 170 92, 170 102, 168 106 L 164 108 C 164 114, 157 120, 148 120 C 138 120, 132 118, 130 114 Z" />
  <ellipse cx="136" cy="102" rx="4" ry="5.5" class="char-skin" />
  <circle cx="156" cy="96" r="1.5" fill="#1E2235" />
  <path class="char-thin" d="M 154 92 Q 157 91 160 93" />
  <path class="char-thin" d="M 161 98 L 166 100 L 161 103" />
  <path class="char-thin" d="M 156 108 Q 160 109 163 106" />
  <path class="char-dark" d="M 130 100 C 126 90, 130 76, 140 70 C 150 62, 168 64, 174 76 C 178 84, 176 94, 168 94 C 162 94, 160 88, 152 86 C 144 84, 138 88, 134 96 Z" />

  <!-- Arms -->
  <!-- Right Arm: Raised placing sticky note on wall -->
  <path class="char-dark" d="M 152 140 C 164 135, 178 125, 190 115 L 205 98 C 210 94, 214 96, 212 102 L 202 115 C 192 128, 178 142, 164 150 Z" />
  <path class="char-skin" d="M 210 96 C 212 92, 218 90, 222 94 C 220 98, 214 100, 208 100 Z" />
  <!-- Sticky Note in Hand being Placed -->
  <rect x="214" y="86" width="24" height="20" rx="1.5" class="char-pants" />

  <!-- Left Arm: Holding extra notes / marker at side -->
  <path class="char-dark" d="M 118 140 C 108 150, 102 170, 105 188 L 100 196 C 96 200, 90 198, 92 192 L 98 178 C 102 165, 108 150, 114 140 Z" />
  <path class="char-skin" d="M 98 196 C 94 198, 90 198, 88 194 C 90 190, 96 190, 100 194 Z" />
  <rect x="84" y="194" width="14" height="4" rx="1" class="char-dark" />
</svg>
