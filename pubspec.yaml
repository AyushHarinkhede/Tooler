name: tooler
description: "Tooler - Complete School Stationery Kit Doodle Toolkit for Android & iOS"
publish_to: 'none'
version: 1.0.11+12

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  shared_preferences: ^2.2.3
  intl: ^0.19.0
  shared_preferences_android: 2.3.4
  path_provider_android: 2.2.15
  sensors_plus: ^7.1.1
  record: ^7.1.2
  audioplayers: ^6.8.1
  path_provider: ^2.1.6
  flutter_svg: ^2.3.4
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/illustrations/
